<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t1_r2_07</title>
</head>
<body>

    <button onclick="crearTabla()">crear</button>

<script>    
function crearTabla() {
    let columnas = parseInt(prompt("Introduce el número de columnas:"));
    let filas = parseInt(prompt("Introduce el número de filas:"));
    let altura = parseInt(prompt("Introduce la altura de las celdas (en píxeles):"));
    let anchura = parseInt(prompt("Introduce la anchura de las celdas (en píxeles):"));
    
    let anchoTotal = columnas * anchura;

    document.write(`<table border="0" cellspacing="2" bgcolor="black" width="${anchoTotal}">`);

    for (let f = 1; f <= filas; f++) {
        document.write(`<tr bgcolor="white" height="${altura}">`);
        
        for (let c = 1; c <= columnas; c++) {
            document.write(`<td width="${anchura}">&nbsp;</td>`);
        }
        
        document.write(`</tr>`);
    }

    document.write(`</table>`);
}
</script>

</body>
</html>
