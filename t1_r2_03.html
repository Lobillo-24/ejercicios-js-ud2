<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t1_r2_03</title>
</head>
<body>

    <button onclick="crearCeldas()">crear</button>

<script>    
function crearCeldas() {
    let columna = parseInt(prompt("Introduce el número de columnas:"));
    let altura = parseInt(prompt("Introduce la altura de las celdas (en píxeles):"));
    let anchura = parseInt(prompt("Introduce la anchura de las celdas (en píxeles):"));
    
    let anchoTotal = columna * anchura;

    document.write(`<table border="0" cellspacing="2" bgcolor="black" width="${anchoTotal}">`);
    document.write(`<tr height="${altura}">`);

    for (let i = 1; i <= columna; i++) {
        let color;
        if (i % 2 !== 0) {
            color = "black";
        } else {
            color = "white";
        }
        document.write(`<td width="${anchura}" bgcolor="${color}">&nbsp;</td>`);
    }

    document.write(`</tr>`);
    document.write(`</table>`);
}
</script>

</body>
</html>
